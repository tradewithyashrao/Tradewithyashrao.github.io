<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Trade With Yashrao | Analyze • Trade • Grow</title>
  <!-- Load Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* Core mobile dark theme styles & smooth animations */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Sticky Top Header reveal transition */
    #sticky-header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
    }
    #sticky-header.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Tactile press & hover feedback */
    .tap-card {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), filter 0.18s ease, border-color 0.2s ease;
      will-change: transform;
    }
    .tap-card:active {
      transform: scale(0.975);
      filter: brightness(1.06);
    }
    @media (hover: hover) {
      .tap-card:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
      }
      .tap-card:active {
        transform: scale(0.98);
      }
    }

    /* Hero Obsidian + Subtle Warm Gold Radial Spotlight */
    .hero-obsidian-gold {
      background:
        radial-gradient(circle at 50% 34%, rgba(212, 175, 55, 0.24) 0%, rgba(161, 120, 32, 0.10) 34%, rgba(12, 12, 15, 0.94) 68%, #000000 100%),
        linear-gradient(180deg, #0b0b0e 0%, #050507 65%, #000000 100%);
    }

    /* Hero bottom fade into pure black */
    .hero-fade {
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.04) 0%,
        rgba(0, 0, 0, 0.16) 44%,
        rgba(0, 0, 0, 0.78) 78%,
        #000000 100%
      );
    }

    /* Gold emblem ring shadow */
    .emblem-ring {
      box-shadow:
        0 0 0 2px rgba(212, 175, 55, 0.65),
        0 0 42px rgba(212, 175, 55, 0.22),
        0 18px 42px rgba(0, 0, 0, 0.85);
    }

    /* Card dark gradient overlay */
    .card-scrim {
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.06) 0%,
        rgba(0, 0, 0, 0.22) 48%,
        rgba(0, 0, 0, 0.82) 100%
      );
    }

    /* Spotlight Card #1 metallic silver-to-charcoal finish */
    .metallic-spotlight {
      background: linear-gradient(180deg, #f4f5f7 0%, #cdd2da 36%, #6f7580 74%, #23252a 100%);
    }

    /* Instagram multi-stop social gradient */
    .social-instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
    }

    /* Smooth accordion dropdown for Community & Stats */
    .accordion-content {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease, margin-top 0.24s ease;
    }
    .accordion-content.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 12px;
    }
    .accordion-inner {
      overflow: hidden;
    }

    /* 5+ Ambient Glow Horizontal Banner Themes (matching link.me screenshots) */
    .banner-emerald {
      background:
        radial-gradient(circle at 18% 50%, rgba(16, 185, 129, 0.88) 0%, rgba(5, 150, 105, 0.28) 44%, transparent 72%),
        radial-gradient(circle at 88% 50%, rgba(16, 185, 129, 0.65) 0%, rgba(6, 78, 59, 0.42) 55%, transparent 82%),
        linear-gradient(90deg, #059669 0%, #053e2f 52%, #059669 100%);
    }
    .banner-orange {
      background:
        radial-gradient(circle at 44% 50%, rgba(234, 88, 12, 0.94) 0%, rgba(194, 65, 12, 0.48) 48%, transparent 76%),
        linear-gradient(90deg, #b9bdc5 0%, #d4d7dc 16%, #c2410c 46%, #9ca3af 86%, #b5bac2 100%);
    }
    .banner-eclipse {
      background:
        radial-gradient(circle at 18% 50%, rgba(71, 85, 105, 0.55) 0%, rgba(15, 23, 42, 0.35) 48%, transparent 74%),
        radial-gradient(circle at 86% 50%, rgba(30, 41, 59, 0.58) 0%, transparent 72%),
        linear-gradient(90deg, #1e242d 0%, #0b0e14 54%, #111827 100%);
    }
    .banner-royal {
      background:
        radial-gradient(circle at 22% 50%, rgba(29, 78, 216, 0.82) 0%, rgba(30, 58, 138, 0.35) 48%, transparent 75%),
        radial-gradient(circle at 86% 50%, rgba(148, 163, 184, 0.52) 0%, rgba(15, 23, 42, 0.35) 56%, transparent 82%),
        linear-gradient(90deg, #172554 0%, #1e293b 54%, #64748b 100%);
    }
    .banner-steel {
      background:
        radial-gradient(circle at 52% 50%, rgba(226, 232, 240, 0.72) 0%, rgba(71, 85, 105, 0.45) 54%, transparent 84%),
        linear-gradient(90deg, #0b1120 0%, #64748b 44%, #cbd5e1 68%, #0f172a 100%);
    }
    .banner-gold {
      background:
        radial-gradient(circle at 24% 50%, rgba(212, 175, 55, 0.78) 0%, rgba(146, 104, 24, 0.32) 48%, transparent 75%),
        radial-gradient(circle at 88% 50%, rgba(212, 175, 55, 0.38) 0%, transparent 70%),
        linear-gradient(90deg, #422006 0%, #18140d 55%, #713f12 100%);
    }

    /* Bottom-Sheet Editor Transitions */
    #editor-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #editor-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    #editor-drawer {
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #editor-drawer.open {
      transform: translateY(0);
    }

    /* Minimal dark scrollbars */
    .dark-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .dark-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }

    /* Toast notification animation */
    #toast-box {
      transform: translate(-50%, 24px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }
    #toast-box.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen antialiased selection:bg-amber-500/30">

  <!-- Sticky Top Header (Smoothly fades in when scrolling past the hero) -->
  <header id="sticky-header" class="fixed top-0 inset-x-0 z-40">
    <div class="max-w-[430px] mx-auto px-4 h-[58px] bg-[#0a0a0c]/95 backdrop-blur-xl border-b border-white/[0.08] flex items-center justify-between">
      <button type="button" id="scroll-top-btn" class="flex items-center gap-2.5 text-left focus:outline-none">
        <div id="sticky-avatar" class="w-[36px] h-[36px] rounded-full overflow-hidden border border-amber-400/50 bg-zinc-900 flex-shrink-0"></div>
        <div class="flex items-center gap-1.5 min-w-0">
          <span id="sticky-name" class="text-[15.5px] font-bold tracking-tight text-white truncate">Trade With Yashrao</span>
          <span id="sticky-verified" class="inline-flex items-center flex-shrink-0"></span>
        </div>
      </button>
      <button type="button" id="sticky-share-btn" aria-label="Copy profile link" class="w-9 h-9 rounded-full bg-white/[0.06] hover:bg-white/[0.12] flex items-center justify-center text-white/80 transition">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Hidden quick file input for 1-tap Hero Bio Photo upload -->
  <input type="file" id="quick-bio-photo-input" accept="image/*" class="hidden" />

  <!-- Main Mobile-First Link-in-Bio Container -->
  <main id="bio-app" class="max-w-[430px] w-full mx-auto min-h-screen bg-black pb-24 relative">
    <!-- Dynamically populated by JavaScript -->
  </main>

  <!-- Floating Bottom-Right Pill Button ("Edit Links & Bio" with gold accent border) -->
  <button
    type="button"
    id="open-editor-btn"
    class="fixed bottom-5 right-5 z-40 flex items-center gap-2 px-4 py-2.5 rounded-full bg-[#111114]/95 hover:bg-[#19191f] border border-amber-400/45 backdrop-blur-xl text-white text-[13px] font-semibold shadow-[0_10px_30px_rgba(0,0,0,0.85)] tap-card"
  >
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
    <span>Edit Links &amp; Bio</span>
  </button>

  <!-- Footer Legal/Info Modal (Privacy Policy, Terms, Report — zero alert()) -->
  <div id="info-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="w-full max-w-[380px] rounded-2xl bg-[#121215] border border-white/10 p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 id="info-modal-title" class="text-[16px] font-bold text-white">Info</h3>
        <button type="button" id="info-modal-close" aria-label="Close modal" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-zinc-300 hover:text-white">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p id="info-modal-body" class="text-[13.5px] leading-relaxed text-zinc-300"></p>
    </div>
  </div>

  <!-- Slide-Up Mobile Editor Drawer -->
  <div id="editor-backdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end justify-center">
    <section id="editor-drawer" class="w-full max-w-[430px] h-[88vh] max-h-[840px] bg-[#0e0e11] border-t border-x border-white/15 rounded-t-[26px] flex flex-col overflow-hidden shadow-2xl">
      <!-- Drawer Grab Bar & Title -->
      <div class="pt-3 pb-2.5 px-4 border-b border-white/[0.08] flex-shrink-0">
        <div class="w-10 h-1 rounded-full bg-zinc-700 mx-auto mb-3"></div>
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-[16px] font-bold text-white tracking-tight">Edit Links &amp; Photos</h2>
            <p class="text-[11.5px] text-zinc-400">Changes save automatically to your browser</p>
          </div>
          <button type="button" id="close-editor-btn" aria-label="Close editor" class="w-8 h-8 rounded-full bg-white/[0.08] hover:bg-white/[0.15] flex items-center justify-center text-white">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- 4 Clean Editor Tabs -->
        <div id="editor-tabs" class="grid grid-cols-4 gap-1 mt-3 p-1 rounded-xl bg-black/70 border border-white/[0.07]">
          <button type="button" data-tab="bio" class="editor-tab py-2 rounded-lg text-[11.5px] font-semibold transition">Bio &amp; Photo</button>
          <button type="button" data-tab="socials" class="editor-tab py-2 rounded-lg text-[11.5px] font-semibold transition">Socials</button>
          <button type="button" data-tab="cards" class="editor-tab py-2 rounded-lg text-[11.5px] font-semibold transition">Cards</button>
          <button type="button" data-tab="export" class="editor-tab py-2 rounded-lg text-[11.5px] font-semibold transition">Export</button>
        </div>
      </div>

      <!-- Dynamic Scrollable Tab Content -->
      <div id="editor-body" class="flex-1 overflow-y-auto dark-scroll p-4 space-y-4"></div>
    </section>
  </div>

  <!-- Toast Notification Pill -->
  <div id="toast-box" class="fixed bottom-20 left-1/2 z-[60] px-4 py-2.5 rounded-full bg-[#151519] border border-amber-400/35 text-white text-[13px] font-medium shadow-2xl whitespace-nowrap max-w-[90vw] truncate">
    Saved
  </div>

  <script>
    (function () {
      'use strict';

      /* =====================================================================
         1. DEFAULT CONFIGURATION & PERSISTENT LOCALSTORAGE STATE
      ===================================================================== */
      const STORAGE_KEY = 'trade_with_yashrao_bio_v2';

      const DEFAULT_STATE = {
        profile: {
          name: 'Trade With Yashrao',
          handle: '@tradewithyashrao',
          verified: true,
          bioPhoto: '',            // Stores uploaded Base64 Data URL or custom image URL
          heroMode: 'emblem',      // 'emblem' (Circular Logo Crest) or 'fullbleed' (Full-Bleed Portrait)
          pillLabel: 'Community & Stats',
          stats: [
            { label: 'Markets', value: 'Forex • Gold • Indices • Crypto' },
            { label: 'Focus', value: 'Analyze • Trade • Grow' },
            { label: 'Style', value: 'SMC • ICT • Price Action' },
            { label: 'Community', value: 'Free Discord & Daily Setups' }
          ],
          bioLine1: 'Analyze • Trade • Grow',
          bioLine2: 'Forex | Gold | Indices | Crypto'
        },
        socials: [
          { id: 'discord', name: 'Discord', url: '#', enabled: true },
          { id: 'instagram', name: 'Instagram', url: '#', enabled: true },
          { id: 'x', name: 'X (Twitter)', url: '#', enabled: true },
          { id: 'youtube', name: 'YouTube', url: '#', enabled: true },
          { id: 'tiktok', name: 'TikTok', url: '#', enabled: true },
          { id: 'telegram', name: 'Telegram', url: '#', enabled: false }
        ],
        spotlight: {
          title: 'Join VIP / Mentorship',
          badge: 'ANALYZE • TRADE • GROW',
          brandMain: 'YASHRAO VIP',
          brandSub: 'FOREX • GOLD • INDICES • CRYPTO',
          url: '#',
          image: ''
        },
        mediaCard: {
          title: 'Trading Livestreams',
          url: '#',
          image: ''
        },
        gridCards: [
          { id: 'discord', title: 'FREE DISCORD', url: '#', image: '' },
          { id: 'tiktok', title: 'TikTok', url: '#', image: '' },
          { id: 'instagram', title: 'Instagram', url: '#', image: '' },
          { id: 'x', title: 'X', url: '#', image: '' }
        ],
        banners: [
          { id: 'b1', title: 'Tradeify', url: '#', theme: 'emerald', logoType: 'tradeify', customLogo: '' },
          { id: 'b2', title: 'NinjaTrader Demo Account', url: '#', theme: 'orange', logoType: 'ninjatrader', customLogo: '' },
          { id: 'b3', title: 'Lucid Trading', url: '#', theme: 'eclipse', logoType: 'lucid', customLogo: '' },
          { id: 'b4', title: 'Apex Trader Funding', url: '#', theme: 'royal', logoType: 'apex', customLogo: '' },
          { id: 'b5', title: 'Blue Guardian', url: '#', theme: 'steel', logoType: 'blueguardian', customLogo: '' }
        ]
      };

      let state = loadState();
      let activeTab = 'bio';
      let statsOpen = false;
      let toastTimer = null;
      let saveToastDebounce = null;
      let resetConfirmArmed = false;

      function deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return deepClone(DEFAULT_STATE);
          const parsed = JSON.parse(raw);
          const base = deepClone(DEFAULT_STATE);
          return {
            profile: Object.assign(base.profile, parsed.profile || {}),
            socials: Array.isArray(parsed.socials) && parsed.socials.length ? parsed.socials : base.socials,
            spotlight: Object.assign(base.spotlight, parsed.spotlight || {}),
            mediaCard: Object.assign(base.mediaCard, parsed.mediaCard || {}),
            gridCards: Array.isArray(parsed.gridCards) && parsed.gridCards.length ? parsed.gridCards : base.gridCards,
            banners: Array.isArray(parsed.banners) ? parsed.banners : base.banners
          };
        } catch (err) {
          return deepClone(DEFAULT_STATE);
        }
      }

      function persistState(silent) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          showToast('Image too large for browser storage — still active for Export');
          return;
        }
        if (!silent) {
          clearTimeout(saveToastDebounce);
          saveToastDebounce = setTimeout(() => showToast('Saved'), 450);
        }
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function isPlaceholderUrl(url) {
        const u = String(url || '').trim();
        return !u || u === '#';
      }

      function normalizeUrl(url) {
        const trimmed = String(url || '').trim();
        if (!trimmed || trimmed === '#') return '#';
        if (/^(https?:|mailto:|tel:)/i.test(trimmed)) return trimmed;
        return 'https://' + trimmed;
      }

      /* =====================================================================
         2. CUSTOM INLINE SVG ASSETS (BRAND CREST, SOCIAL ICONS & BANNER TILES)
      ===================================================================== */
      function getVerifiedBadgeSvg(size) {
        const s = size || 22;
        return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-label="Verified" class="flex-shrink-0">
          <path d="M12 1.8l2.18 1.54 2.66-.27 1.13 2.43 2.43 1.13-.27 2.66L22.2 12l-1.54 2.18.27 2.66-2.43 1.13-1.13 2.43-2.66-.27L12 22.2l-2.18-1.54-2.66.27-1.13-2.43-2.43-1.13.27-2.66L1.8 12l1.54-2.18-.27-2.66 2.43-1.13 1.13-2.43 2.66.27L12 1.8z" fill="#6C63FF"/>
          <path d="M8.6 12.2l2.25 2.25 4.75-4.9" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      }

      const LINK_CHAIN_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>`;

      /* High-detail inline SVG recreation of the "Trade With Yashrao" circular gold-rimmed crest */
      function getYashraoCrestSvg(compact) {
        const uid = compact ? 'sm' : 'lg';
        return `<svg viewBox="0 0 400 400" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="crestBg_${uid}" cx="50%" cy="46%" r="54%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="76%" stop-color="#f5f3ee"/>
              <stop offset="100%" stop-color="#e5dfd1"/>
            </radialGradient>
            <linearGradient id="goldRim_${uid}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#9a7228"/>
              <stop offset="30%" stop-color="#f5dc8c"/>
              <stop offset="55%" stop-color="#b8872f"/>
              <stop offset="82%" stop-color="#fae49e"/>
              <stop offset="100%" stop-color="#7c5617"/>
            </linearGradient>
            <linearGradient id="bullFill_${uid}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2b261d"/>
              <stop offset="45%" stop-color="#0b0b0d"/>
              <stop offset="100%" stop-color="#1c1812"/>
            </linearGradient>
            <linearGradient id="roadGrad_${uid}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d4af37" stop-opacity="0.7"/>
              <stop offset="35%" stop-color="#111114"/>
              <stop offset="100%" stop-color="#050507"/>
            </linearGradient>
            <clipPath id="circleClip_${uid}">
              <circle cx="200" cy="200" r="190"/>
            </clipPath>
          </defs>

          <!-- Circular Medallion Surface -->
          <circle cx="200" cy="200" r="194" fill="url(#goldRim_${uid})"/>
          <circle cx="200" cy="200" r="189" fill="url(#crestBg_${uid})"/>

          <g clip-path="url(#circleClip_${uid})">
            <!-- Inner Gold Arc Halo -->
            <path d="M 118 212 A 96 96 0 1 1 286 126" fill="none" stroke="url(#goldRim_${uid})" stroke-width="3.2" opacity="0.88"/>

            <!-- Top-Left Slogan: ANALYZE / TRADE / GROW -->
            <line x1="76" y1="68" x2="76" y2="108" stroke="#b8872f" stroke-width="1.6"/>
            <text x="84" y="80" fill="#18181b" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2">ANALYZE</text>
            <text x="84" y="92" fill="#18181b" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2">TRADE</text>
            <text x="84" y="104" fill="#18181b" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2">GROW</text>

            <!-- Rising Black & Gold Candlesticks Behind Bull -->
            <g opacity="0.9">
              <line x1="88" y1="168" x2="88" y2="206" stroke="#b8872f" stroke-width="1.2"/>
              <rect x="84" y="178" width="8" height="18" rx="1" fill="#d4af37"/>

      /* =====================================================================
         4. IMAGE FILE READER & SMART RESIZE/COMPRESSION TO DATA URL
      ===================================================================== */
      function handleImageUpload(file, maxDim, quality, callback) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            try {
              const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              // Keep PNG transparency only if small, otherwise clean high-quality JPEG
              const isPng = file.type === 'image/png' && w <= 650;
              const dataUrl = isPng
                ? canvas.toDataURL('image/png')
                : canvas.toDataURL('image/jpeg', quality);
              callback(dataUrl);
            } catch (err) {
              showToast('Could not process photo. Try another image.');
            }
          };
          img.onerror = function () {
            showToast('Invalid image file.');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

        ).join('');

        const gridMarkup = state.gridCards.map(c => {

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>${escapeHtml(p.name)} | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:#000;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:430px;width:100%;margin:0 auto;min-height:100vh;background:#000;padding-bottom:36px}
    .cover-img{width:100%;height:100%;object-fit:cover;display:block}
    .sticky{position:fixed;top:0;left:0;right:0;z-index:40;transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .24s ease}
    .sticky.visible{transform:translateY(0);opacity:1;pointer-events:auto}
    .sticky-in{max-width:430px;margin:0 auto;height:58px;padding:0 16px;background:rgba(10,10,12,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;cursor:pointer}
    .avatar{width:36px;height:36px;border-radius:9999px;overflow:hidden;border:1px solid rgba(251,191,36,.5);flex-shrink:0}
    .sticky-name{font-size:15.5px;font-weight:700;letter-spacing:-0.01em}
    .hero-emblem-wrap{position:relative;width:100%;padding:48px 0 12px;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(circle at 50% 34%,rgba(212,175,55,.24) 0%,rgba(161,120,32,.1) 34%,rgba(12,12,15,.94) 68%,#000 100%),linear-gradient(180deg,#0b0b0e 0%,#050507 65%,#000 100%)}
    .emblem{width:212px;height:212px;border-radius:9999px;overflow:hidden;background:#f7f5ef;box-shadow:0 0 0 2px rgba(212,175,55,.65),0 0 42px rgba(212,175,55,.22),0 18px 42px rgba(0,0,0,.85)}
    .hero-id-fade{width:100%;padding:20px 16px 4px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 72%)}
    .hero-full{position:relative;width:100%;height:390px;overflow:hidden;background:radial-gradient(circle at 50% 34%,rgba(212,175,55,.24) 0%,#0b0b0e 65%,#000 100%)}
    .hero-full-center{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding-bottom:54px}
    .hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.16) 44%,rgba(0,0,0,.78) 78%,#000 100%)}
    .hero-overlay{position:absolute;left:0;right:0;bottom:0;padding:0 16px 8px;text-align:center}
    .name-row{display:flex;align-items:center;justify-content:center;gap:8px}
    h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-0.025em;text-shadow:0 2px 10px rgba(0,0,0,.85)}
    .handle{margin:3px 0 0;font-size:14px;font-weight:500;color:#9ca3af}
    .profile-body{padding:10px 16px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .socials{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
    .social-btn{width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.45)}
    .social-discord{background:#5865F2}
    .social-instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
    .social-x{background:#18181b;border:1px solid rgba(255,255,255,.15)}
    .social-youtube{background:#FF0000}
    .social-tiktok{background:#09090b;border:1px solid rgba(255,255,255,.15)}
    .social-telegram{background:#229ED9}
    .pill-wrap{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:16px}
    .pill-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;background:#161618;border:1px solid #27272a;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
    .pill-chev{transition:transform .25s ease}
    .pill-btn.open .pill-chev{transform:rotate(180deg)}
    .acc{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .28s ease,opacity .24s ease,margin-top .24s ease;width:100%;max-width:350px}
    .acc.open{grid-template-rows:1fr;opacity:1;margin-top:12px}
    .acc-in{overflow:hidden}
    .stat-box{border-radius:16px;background:#111114;border:1px solid rgba(255,255,255,.08);padding:6px 16px;text-align:left}
    .stat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
    .stat-row:last-child{border-bottom:none}
    .stat-l{color:#a1a1aa}
    .stat-v{color:#fff;font-weight:600;text-align:right}
    .bio{margin-top:20px;max-width:350px}
    .bio p{margin:0;font-size:15px;line-height:1.4;font-weight:600;color:rgba(255,255,255,.95)}
    .bio p+p{margin-top:8px;font-size:14px;font-weight:500;color:#d4d4d8}
    .stack{padding:0 16px;display:flex;flex-direction:column;gap:14px}
    .card-lg{position:relative;display:block;width:100%;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
    .card-spot{height:210px;border-radius:22px;background:linear-gradient(180deg,#f4f5f7 0%,#cdd2da 36%,#6f7580 74%,#23252a 100%)}
    .card-media{aspect-ratio:16/10;border-radius:20px;background:#111827}
    .spot-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 28px}
    .spot-pill{padding:4px 12px;border-radius:9999px;background:rgba(0,0,0,.85);color:#fcd34d;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
    .spot-brand{display:flex;align-items:center;gap:12px}
    .spot-main{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:#09090b;line-height:1}
    .spot-sub{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:#27272a;margin-top:4px}
    .card-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 0%,rgba(0,0,0,.22) 48%,rgba(0,0,0,.82) 100%)}
    .spot-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 100%)}
    .corner{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff}
    .corner-link{background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
    .corner-yt{background:#FF0000;box-shadow:0 4px 12px rgba(0,0,0,.4)}
    .card-title{position:absolute;left:16px;right:16px;bottom:14px;text-align:center;font-size:18.5px;font-weight:700;letter-spacing:-0.015em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.88)}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .grid-card{position:relative;display:block;border-radius:18px;overflow:hidden;aspect-ratio:1.28/1;background:#18181b;border:1px solid rgba(255,255,255,.08)}
    .grid-badge{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.4)}
    .badge-dark{background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.15)}
    .grid-title{position:absolute;left:8px;right:8px;bottom:10px;text-align:center;font-size:14.5px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85)}
    .banners{display:flex;flex-direction:column;gap:12px;padding-top:2px}
    .banner{width:100%;height:76px;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.09);overflow:hidden}
    .banner-logo{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.35)}
    .tile{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    .banner-title{font-size:16px;font-weight:700;letter-spacing:-0.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.45)}
    .banner-emerald{background:radial-gradient(circle at 18% 50%,rgba(16,185,129,.88) 0%,rgba(5,150,105,.28) 44%,transparent 72%),radial-gradient(circle at 88% 50%,rgba(16,185,129,.65) 0%,rgba(6,78,59,.42) 55%,transparent 82%),linear-gradient(90deg,#059669 0%,#053e2f 52%,#059669 100%)}
    .banner-orange{background:radial-gradient(circle at 44% 50%,rgba(234,88,12,.94) 0%,rgba(194,65,12,.48) 48%,transparent 76%),linear-gradient(90deg,#b9bdc5 0%,#d4d7dc 16%,#c2410c 46%,#9ca3af 86%,#b5bac2 100%)}
    .banner-eclipse{background:radial-gradient(circle at 18% 50%,rgba(71,85,105,.55) 0%,rgba(15,23,42,.35) 48%,transparent 74%),radial-gradient(circle at 86% 50%,rgba(30,41,59,.58) 0%,transparent 72%),linear-gradient(90deg,#1e242d 0%,#0b0e14 54%,#111827 100%)}
    .banner-royal{background:radial-gradient(circle at 22% 50%,rgba(29,78,216,.82) 0%,rgba(30,58,138,.35) 48%,transparent 75%),radial-gradient(circle at 86% 50%,rgba(148,163,184,.52) 0%,rgba(15,23,42,.35) 56%,transparent 82%),linear-gradient(90deg,#172554 0%,#1e293b 54%,#64748b 100%)}
    .banner-steel{background:radial-gradient(circle at 52% 50%,rgba(226,232,240,.72) 0%,rgba(71,85,105,.45) 54%,transparent 84%),linear-gradient(90deg,#0b1120 0%,#64748b 44%,#cbd5e1 68%,#0f172a 100%)}
    .banner-gold{background:radial-gradient(circle at 24% 50%,rgba(212,175,55,.78) 0%,rgba(146,104,24,.32) 48%,transparent 75%),radial-gradient(circle at 88% 50%,rgba(212,175,55,.38) 0%,transparent 70%),linear-gradient(90deg,#422006 0%,#18140d 55%,#713f12 100%)}
    .tap-card{transition:transform .18s cubic-bezier(.22,1,.36,1),filter .18s ease}
    .tap-card:active{transform:scale(.975);filter:brightness(1.06)}
    footer{margin-top:34px;text-align:center;font-size:13px;color:#71717a}
    footer a{color:#71717a;margin:0 8px}
    footer a:hover{color:#d4d4d8}
  </style>
</head>
<body>
  <header id="sticky" class="sticky">
    <div class="sticky-in" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <div class="avatar">${avatarInner}</div>
      <span class="sticky-name">${escapeHtml(p.name)}</span>
      ${p.verified ? getVerifiedBadgeSvg(17) : ''}
    </div>
  </header>

  <main class="wrap">
    ${heroSection}

    <section class="profile-body">
      <div class="socials">${socialsMarkup}</div>
      <div class="pill-wrap">
        <button type="button" id="pillBtn" class="pill-btn tap-card" aria-expanded="false">
          <span>${escapeHtml(p.pillLabel || 'Community & Stats')}</span>
          <svg class="pill-chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="acc" class="acc"><div class="acc-in"><div class="stat-box">${statsMarkup}</div></div></div>
      </div>
      <div class="bio">
        <p>${escapeHtml(p.bioLine1)}</p>
        <p>${escapeHtml(p.bioLine2)}</p>
      </div>
    </section>

    <section class="stack">
      <a href="${escapeHtml(normalizeUrl(state.spotlight.url))}" target="_blank" rel="noopener noreferrer" class="card-lg card-spot tap-card">
        ${state.spotlight.image
          ? `<img src="${escapeHtml(state.spotlight.image)}" alt="${escapeHtml(state.spotlight.title)}" class="cover-img" />`
          : `<div class="spot-center"><span class="spot-pill">${escapeHtml(state.spotlight.badge)}</span><div class="spot-brand"><svg width="42" height="42" viewBox="0 0 48 48" fill="none"><path d="M6 16L18 8V26L6 16Z" fill="#09090b"/><path d="M42 16L30 8V26L42 16Z" fill="#09090b"/><path d="M18 26L24 38L30 26H18Z" fill="#09090b"/></svg><div><div class="spot-main">${escapeHtml(state.spotlight.brandMain)}</div><div class="spot-sub">${escapeHtml(state.spotlight.brandSub)}</div></div></div></div>`}
        <div class="spot-scrim"></div>
        <div class="corner corner-link">${LINK_CHAIN_SVG}</div>
        <div class="card-title">${escapeHtml(state.spotlight.title)}</div>
      </a>

      <a href="${escapeHtml(normalizeUrl(state.mediaCard.url))}" target="_blank" rel="noopener noreferrer" class="card-lg card-media tap-card">
        ${state.mediaCard.image ? `<img src="${escapeHtml(state.mediaCard.image)}" alt="${escapeHtml(state.mediaCard.title)}" class="cover-img" />` : getDefaultMediaSvg()}
        <div class="card-scrim"></div>
        <div class="corner corner-yt">${getSocialIconSvg('youtube', 18)}</div>
        <div class="card-title">${escapeHtml(state.mediaCard.title)}</div>
      </a>

      <div class="grid2">${gridMarkup}</div>
      <div class="banners">${bannersMarkup}</div>
    </section>

    <footer>
      <a href="#top">Privacy Policy</a>|<a href="#top">Terms</a>|<a href="#top">Report</a>
    </footer>
  </main>

  <script>
    (function(){
      var s=document.getElementById('sticky');
      window.addEventListener('scroll',function(){
        if(window.scrollY>260){s.classList.add('visible')}else{s.classList.remove('visible')}
      },{passive:true});
      var b=document.getElementById('pillBtn'),a=document.getElementById('acc');
      if(b&&a){b.addEventListener('click',function(){
        var o=a.classList.toggle('open');
        b.classList.toggle('open',o);
        b.setAttribute('aria-expanded',String(o));
      });}
    })();
  <\/script>
</body>
</html>`;
      }

      /* =====================================================================
         7. CONTROLS, CLIPBOARD, DOWNLOAD, MODALS & SCROLL OBSERVER
      ===================================================================== */
      function showToast(msg) {
        const box = document.getElementById('toast-box');
        box.textContent = msg;
        box.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => box.classList.remove('show'), 2500);
      }

      function copyTextToClipboard(text, successMsg) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(ok ? successMsg : 'Tap Download Clean index.html instead');
        } catch (err) {
          showToast('Copy unavailable — use Download Clean index.html');
        }
      }

      function downloadCleanHtml() {
        try {
          const html = buildCleanStandaloneHTML();
          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          showToast('Downloaded clean index.html');
        } catch (err) {
          showToast('Download blocked — use Copy Clean HTML Code');
        }
      }

      function openDrawer(initialTab) {
        if (initialTab) activeTab = initialTab;
        renderEditorDrawer();
        document.getElementById('editor-backdrop').classList.add('open');
        requestAnimationFrame(() => document.getElementById('editor-drawer').classList.add('open'));
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        document.getElementById('editor-drawer').classList.remove('open');
        document.getElementById('editor-backdrop').classList.remove('open');
        document.body.style.overflow = '';
      }

      function openFooterModal(type) {
        const modal = document.getElementById('info-modal');
        const title = document.getElementById('info-modal-title');
        const body = document.getElementById('info-modal-body');
        if (type === 'privacy') {
          title.textContent = 'Privacy Policy';
          body.textContent = 'This Link in Bio page does not collect, sell, or track personal visitor data. Clicking any card takes you directly to the official channel or partner website.';
        } else if (type === 'terms') {
          title.textContent = 'Terms & Risk Disclosure';
          body.textContent = 'Trading Forex, Gold, Indices, and Crypto carries substantial risk of loss and is not suitable for every investor. All content shared by Trade With Yashrao is strictly educational and not financial advice.';
        } else {
          title.textContent = 'Report an Issue';
          body.textContent = 'If a link is broken or you notice impersonation of @tradewithyashrao, please reach out directly through the official verified social channels listed on this page.';
        }
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeFooterModal() {
        const modal = document.getElementById('info-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      // Sticky Scroll Header Listener
      window.addEventListener('scroll', () => {
        const sticky = document.getElementById('sticky-header');
        if (window.scrollY > 260) {
          sticky.classList.add('visible');
        } else {
          sticky.classList.remove('visible');
        }
      }, { passive: true });

      // Quick 1-Tap Hero Bio Photo File Input Listener
      document.getElementById('quick-bio-photo-input').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        handleImageUpload(file, 800, 0.86, dataUrl => {
          state.profile.bioPhoto = dataUrl;
          updateApp(true, 'Bio photo added!');
        });
        e.target.value = '';
      });

      // Global Controls
      document.getElementById('scroll-top-btn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      document.getElementById('sticky-share-btn').addEventListener('click', () => copyTextToClipboard(window.location.href, 'Page link copied'));
      document.getElementById('open-editor-btn').addEventListener('click', () => openDrawer());
      document.getElementById('close-editor-btn').addEventListener('click', closeDrawer);
      document.getElementById('editor-backdrop').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeDrawer();
      });
      document.getElementById('info-modal-close').addEventListener('click', closeFooterModal);
      document.getElementById('info-modal').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeFooterModal();
      });

      document.querySelectorAll('.editor-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          activeTab = btn.getAttribute('data-tab');
          renderEditorDrawer();
        });
      });

      // Initial render
      renderBioPage();
    })();
  </script>
</body>
</html>
